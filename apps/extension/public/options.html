<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ghost Grader options</title>
    <style>
      body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2a33; max-width: 520px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; font-weight: 600; margin: 14px 0 4px; }
      input { width: 100%; padding: 8px 10px; border: 1px solid #dfe4e8; border-radius: 6px; font: inherit; }
      button { margin-top: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid #5b3df5; background: #5b3df5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .hint { color: #66737d; font-size: 12.5px; }
      #status { margin-left: 10px; color: #0b874b; }
    </style>
  </head>
  <body>
    <h1>👻 Ghost Grader</h1>
    <p class="hint">Where the Ghost Grader API runs and which teacher you grade as. The API stores rubrics, decisions and sessions; the extension only reads the Moodle page.</p>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" placeholder="http://localhost:8787" />
    <label for="webBase">Web app URL</label>
    <input id="webBase" placeholder="http://localhost:5173" />
    <label for="teacherId">Teacher id</label>
    <input id="teacherId" placeholder="t-demo" />
    <p class="hint">A real deployment replaces this with a login; the demo scopes data by this id.</p>
    <button id="save" type="button">Save</button><span id="status"></span>
    <script type="module" src="options.js"></script>
  </body>
</html>
